  <title>Blister: downloads at a blistering pace</title>
  <meta name="description" content="Blister is a free, open-source download manager. Sixteen connections per file, torrents, video sites, a smart queue and resume that survives a reboot. No accounts, no ads, no telemetry.">

  <link rel="stylesheet" href="blister.css">
  <script>
    // Apply saved accent and mode before first paint so the page doesn't flash.
    try {
      const d = document.documentElement;
      d.dataset.accent = localStorage.getItem("blister-accent") || "blister";
      const mode = localStorage.getItem("blister-mode");
      if (mode === "dark" || (!mode && matchMedia("(prefers-color-scheme: dark)").matches)) d.dataset.theme = "dark";
    } catch {}
  </script>
